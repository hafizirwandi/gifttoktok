<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" fill="none">
    <style>
        .gtt-bg { fill: #f1f5f9; }
        .gtt-border { stroke: #94a3b8; }
        .gtt-box { fill: #94a3b8; }
        @media (prefers-color-scheme: dark) {
            .gtt-bg { fill: #1e293b; }
            .gtt-border { stroke: #64748b; }
            .gtt-box { fill: #64748b; }
        }
    </style>
    <!-- Bingkai seperti HP, 9:16, SAMA PERSIS dgn ikon layout lain (konsisten). Isinya
         grid 3x3 dipusatkan (area 60x60, sama dgn layout-grid-2x2.svg, dibagi 9 kursi). -->
    <rect class="gtt-bg gtt-border" x="3" y="3" width="84" height="154" rx="16" stroke-width="3"/>
    <rect class="gtt-box" x="15" y="50" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="36" y="50" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="57" y="50" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="15" y="71" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="36" y="71" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="57" y="71" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="15" y="92" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="36" y="92" width="18" height="18" rx="3"/>
    <rect class="gtt-box" x="57" y="92" width="18" height="18" rx="3"/>
</svg>
