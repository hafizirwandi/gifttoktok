; php.ini untuk PHP portable versi desktop (installer Windows).
; Disalin ke runtime\php\php.ini oleh installer/build.ps1. php.exe di Windows otomatis
; membaca php.ini di folder yang sama dengan php.exe. extension_dir & CA bundle
; dipassing launcher lewat -d (butuh path absolut, folder instalasi bisa di mana saja).

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zend.enable_gc = On
expose_php = Off

max_execution_time = 300
max_input_time = 300
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On

; Upload animasi overlay (WebM) & gambar background bisa besar.
post_max_size = 512M
upload_max_filesize = 512M
max_file_uploads = 50
file_uploads = On

variables_order = "GPCS"
request_order = "GP"
default_charset = "UTF-8"
allow_url_fopen = On
default_socket_timeout = 60

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip

[Date]
date.timezone = Asia/Jakarta

[opcache]
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
