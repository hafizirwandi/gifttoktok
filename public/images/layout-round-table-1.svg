<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" fill="none">
    <style>
        .gtt-bg { fill: #f1f5f9; }
        .gtt-border { stroke: #94a3b8; }
        .gtt-box { fill: #94a3b8; }
        @media (prefers-color-scheme: dark) {
            .gtt-bg { fill: #1e293b; }
            .gtt-border { stroke: #64748b; }
            .gtt-box { fill: #64748b; }
        }
    </style>
    <!-- Bingkai seperti HP, 9:16, SAMA PERSIS dgn ikon layout lain (konsisten). Isinya
         "Meja Bundar I": grid unit 4 kolom x 4 baris SERAGAM (kontainer persegi) - 4
         kursi persegi kiri (kolom 1) + 4 kursi persegi kanan (kolom 4), celah kosong
         2 kolom x 4 baris di tengah (kolom 2-3), lihat DisplayMode::MejaBundarSatu. -->
    <rect class="gtt-bg gtt-border" x="3" y="3" width="84" height="154" rx="16" stroke-width="3"/>
    <rect class="gtt-box" x="10" y="30" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="10" y="48" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="10" y="66" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="10" y="84" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="64" y="30" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="64" y="48" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="64" y="66" width="15" height="15" rx="3"/>
    <rect class="gtt-box" x="64" y="84" width="15" height="15" rx="3"/>
</svg>
