<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" fill="none">
    <style>
        .gtt-bg { fill: #f1f5f9; }
        .gtt-border { stroke: #94a3b8; }
        .gtt-box { fill: #94a3b8; }
        @media (prefers-color-scheme: dark) {
            .gtt-bg { fill: #1e293b; }
            .gtt-border { stroke: #64748b; }
            .gtt-box { fill: #64748b; }
        }
    </style>
    <!-- Bingkai seperti HP, 9:16, SAMA PERSIS dgn ikon layout lain (konsisten). Isinya
         "Sorotan VI": 1 kotak besar di kiri (2x lebar, 3x tinggi kotak kecil) + 3
         kotak persegi kecil bertumpuk 1 kolom x 3 baris di kanan, lihat
         DisplayMode::SorotanEnam. -->
    <rect class="gtt-bg gtt-border" x="3" y="3" width="84" height="154" rx="16" stroke-width="3"/>
    <rect class="gtt-box" x="10" y="44" width="47" height="72" rx="4"/>
    <rect class="gtt-box" x="60" y="44" width="22" height="22" rx="3"/>
    <rect class="gtt-box" x="60" y="69" width="22" height="22" rx="3"/>
    <rect class="gtt-box" x="60" y="94" width="22" height="22" rx="3"/>
</svg>
