<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" fill="none">
    <style>
        .gtt-bg { fill: #f1f5f9; }
        .gtt-border { stroke: #94a3b8; }
        .gtt-box { fill: #94a3b8; }
        @media (prefers-color-scheme: dark) {
            .gtt-bg { fill: #1e293b; }
            .gtt-border { stroke: #64748b; }
            .gtt-box { fill: #64748b; }
        }
    </style>
    <!-- Bingkai seperti HP, 9:16, SAMA PERSIS dgn layout-vertical.svg/layout-horizontal.svg
         (konsisten). Isinya 1 kotak besar mengisi hampir seluruh bingkai (rasio kotak ini
         SENDIRI = 9:16, kebetulan sama dgn bingkai luar), merepresentasikan "1 kursi
         memenuhi layar rasio potret". -->
    <rect class="gtt-bg gtt-border" x="3" y="3" width="84" height="154" rx="16" stroke-width="3"/>
    <rect class="gtt-box" x="8" y="8" width="74" height="144" rx="8"/>
</svg>
