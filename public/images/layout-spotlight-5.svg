<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" fill="none">
    <style>
        .gtt-bg { fill: #f1f5f9; }
        .gtt-border { stroke: #94a3b8; }
        .gtt-box { fill: #94a3b8; }
        @media (prefers-color-scheme: dark) {
            .gtt-bg { fill: #1e293b; }
            .gtt-border { stroke: #64748b; }
            .gtt-box { fill: #64748b; }
        }
    </style>
    <!-- Bingkai seperti HP, 9:16, SAMA PERSIS dgn ikon layout lain (konsisten). Isinya
         "Sorotan V" (case enum tetap KisiDinamis, cuma label-nya diganti supaya
         segaris dgn keluarga Sorotan lainnya): 3 kotak total - 1 kotak persegi
         panjang (tinggi penuh) di kiri + 2 kotak persegi susun di kanan, lihat
         DisplayMode::KisiDinamis. -->
    <rect class="gtt-bg gtt-border" x="3" y="3" width="84" height="154" rx="16" stroke-width="3"/>
    <rect class="gtt-box" x="12" y="55" width="26" height="55" rx="4"/>
    <rect class="gtt-box" x="41" y="55" width="26" height="26" rx="3"/>
    <rect class="gtt-box" x="41" y="84" width="26" height="26" rx="3"/>
</svg>
