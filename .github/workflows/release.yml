# Build installer Windows (GiftTokTok-Setup-x.y.z.exe) & publish ke GitHub Releases.
#
# Rilis versi baru:   git tag v1.2.0 && git push origin v1.2.0
# Tes build saja:     tab Actions -> "Release installer" -> Run workflow (hasilnya jadi
#                     artifact workflow, TIDAK dipublish, user tidak dapat notifikasi update)
#
# Lihat installer/README.md.

name: Release installer

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi build tes (MAJOR.MINOR.PATCH, tidak dipublish)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Tentukan versi
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag/versi harus vMAJOR.MINOR.PATCH, dapat '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # PHP & Node di runner hanya untuk composer/npm saat build - runtime yang dibawa
      # installer diunduh terpisah oleh build.ps1 (versi major yang sama).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload artifact (build tes)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GiftTokTok-Setup-${{ steps.version.outputs.version }}
          path: installer/build/output/*.exe

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/build/output/*.exe
          generate_release_notes: true
