<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160" fill="none">
    <style>
        .gtt-bg { fill: #f1f5f9; }
        .gtt-border { stroke: #94a3b8; }
        .gtt-box { fill: #94a3b8; }
        @media (prefers-color-scheme: dark) {
            .gtt-bg { fill: #1e293b; }
            .gtt-border { stroke: #64748b; }
            .gtt-box { fill: #64748b; }
        }
    </style>
    <!-- Bingkai seperti HP, 9:16, SAMA PERSIS dgn ikon layout lain (konsisten). Isinya
         "2x1 (Persegi Panjang)": 2 kotak persegi panjang tinggi berdampingan (spt
         split-screen duet), kontainer rasio 9:16 (bukan persegi per kursi), lihat
         DisplayMode::Grid2x1Rect. -->
    <rect class="gtt-bg gtt-border" x="3" y="3" width="84" height="154" rx="16" stroke-width="3"/>
    <rect class="gtt-box" x="10" y="20" width="33" height="120" rx="4"/>
    <rect class="gtt-box" x="46" y="20" width="33" height="120" rx="4"/>
</svg>
